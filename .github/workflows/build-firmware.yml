
name: Build Minipad Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build 2-key development firmware
        run: pio run -e minipad-2k-dev

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: minipad-2k-dev-firmware
          path: .pio/build/minipad-2k-dev/*.uf2
          if-no-files-found: error
